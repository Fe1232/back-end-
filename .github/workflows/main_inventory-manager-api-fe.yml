# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - inventory-manager-api-fe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci

          npx prima generate

          echo "=== Prisma versions ==="
          npm ls @prisma/client prisma

          echo "=== PrismaClient export ==="
          node -e "import('@prisma/client').then(m => console.log(typeof m.PrismaClient))"

          echo "=== Prisma package.json ==="
          cat node_modules/@prisma/client/package.json

          echo "=== Prisma index.js ==="
          cat node_modules/@prisma/client/index.js

          echo "=== Prisma generated files ==="
          ls -la node_modules/@prisma/client

          npm run build --if-present
          npm run test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AD7585BA10F04C64BB32DE3C9282AD65 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_257041E84AA0439789D4396B1419C1B8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_23F0BB4542F747478CF145E14170ED6E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'inventory-manager-api-fe'
          slot-name: 'Production'
          package: .
          
