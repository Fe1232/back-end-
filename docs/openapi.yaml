openapi: 3.0.3
info:
  title: Inventory Manager API
  description: |
    REST API for inventory management.

    Version 1.0.0 provides user registration, JWT authentication,
    account deletion and product CRUD operations.
  version: 1.0.0
  license:
    name: ISC

servers:
  - url: https://inventory-manager-api-fe-g4cjgadneahudhcb.brazilsouth-01.azurewebsites.net
    description: Production - Azure App Service

tags:
  - name: Authentication
    description: Account creation and authentication
  - name: Users
    description: User account operations
  - name: Products
    description: Inventory product operations

paths:
  /users:
    post:
      tags: [Authentication]
      summary: Create account
      description: Creates a new user account.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              nameStore: Minha Loja
              email: usuario@email.com
              key: senha123
              accountPro: false
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Invalid account data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name_required:
                  value:
                    error: O nome da loja é obrigatório.
                    code: ACCOUNT_NAME_REQUIRED
                email_required:
                  value:
                    error: O e-mail é obrigatório.
                    code: ACCOUNT_EMAIL_REQUIRED
                email_invalid:
                  value:
                    error: O e-mail informado é inválido.
                    code: ACCOUNT_EMAIL_INVALID
                password_short:
                  value:
                    error: A senha deve ter pelo menos 6 caracteres.
                    code: ACCOUNT_PASSWORD_TOO_SHORT
                account_pro_invalid:
                  value:
                    error: O campo accountPro deve ser verdadeiro ou falso.
                    code: ACCOUNT_PRO_INVALID
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Já existe um usuário cadastrado com este e-mail.
                code: EMAIL_ALREADY_REGISTERED
        '500':
          description: Account creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível criar a conta neste momento.
                code: ACCOUNT_CREATE_FAILED

  /login:
    post:
      tags: [Authentication]
      summary: Login
      description: Authenticates a user and returns a JWT valid for one hour.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@email.com
              key: senha123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid login data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_required:
                  value:
                    error: O e-mail é obrigatório.
                    code: LOGIN_EMAIL_REQUIRED
                email_invalid:
                  value:
                    error: O e-mail informado é inválido.
                    code: LOGIN_EMAIL_INVALID
                password_required:
                  value:
                    error: A senha é obrigatória.
                    code: LOGIN_PASSWORD_REQUIRED
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: E-mail ou senha inválidos.
                code: INVALID_CREDENTIALS
        '500':
          description: Login failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível entrar agora.
                code: LOGIN_FAILED

  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated user
      description: Returns only the public data of the user identified by the JWT.
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                token_missing:
                  value:
                    error: Token de autenticação não fornecido.
                    code: AUTH_TOKEN_MISSING
                token_invalid:
                  value:
                    error: Token inválido ou expirado.
                    code: AUTH_TOKEN_INVALID
                auth_config_invalid:
                  value:
                    error: A autenticação não está configurada corretamente.
                    code: AUTH_CONFIG_INVALID
        '404':
          description: Authenticated user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A conta desta sessão não foi encontrada.
                code: USER_NOT_FOUND
        '500':
          description: User lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível carregar os usuários agora.
                code: USER_LIST_FAILED

  /users/{id}/password:
    patch:
      tags: [Users]
      summary: Update password
      description: Changes the authenticated user's password after verifying the current password. The path ID must match the authenticated user's ID.
      operationId: updateUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              currentPassword: senha-atual
              newPassword: nova-senha
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid password update data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                data_required:
                  value:
                    error: O corpo da requisição é obrigatório.
                    code: PASSWORD_UPDATE_DATA_REQUIRED
                field_not_allowed:
                  value:
                    error: Apenas currentPassword e newPassword podem ser enviados.
                    code: PASSWORD_UPDATE_FIELD_NOT_ALLOWED
                current_password_required:
                  value:
                    error: A senha atual é obrigatória.
                    code: CURRENT_PASSWORD_REQUIRED
                new_password_required:
                  value:
                    error: A nova senha é obrigatória.
                    code: NEW_PASSWORD_REQUIRED
                password_too_short:
                  value:
                    error: A senha deve ter pelo menos 6 caracteres.
                    code: ACCOUNT_PASSWORD_TOO_SHORT
        '401':
          description: Missing, invalid or incorrect authentication data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                token_invalid:
                  value:
                    error: Token inválido ou expirado.
                    code: AUTH_TOKEN_INVALID
                current_password_invalid:
                  value:
                    error: A senha atual está incorreta.
                    code: CURRENT_PASSWORD_INVALID
        '403':
          description: User is not authorized to update this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Você não tem autorização para alterar este usuário.
                code: USER_PASSWORD_UPDATE_FORBIDDEN
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nenhum usuário foi encontrado com o ID informado.
                code: USER_NOT_FOUND
        '500':
          description: Password update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível alterar a senha neste momento.
                code: USER_PASSWORD_UPDATE_FAILED

  /users/{id}:
    put:
      tags: [Users]
      summary: Update account
      description: Updates the authenticated user's nameStore and email. The path ID must match the authenticated user's ID.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              nameStore: Nova Loja
              email: novo@email.com
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                data_required:
                  value:
                    error: Informe nameStore ou email para atualizar a conta.
                    code: USER_UPDATE_DATA_REQUIRED
                field_not_allowed:
                  value:
                    error: Apenas nameStore e email podem ser alterados.
                    code: USER_UPDATE_FIELD_NOT_ALLOWED
                name_invalid:
                  value:
                    error: O nome da loja não pode estar vazio.
                    code: ACCOUNT_NAME_INVALID
                email_required:
                  value:
                    error: O e-mail é obrigatório.
                    code: ACCOUNT_EMAIL_REQUIRED
                email_invalid:
                  value:
                    error: O e-mail informado é inválido.
                    code: ACCOUNT_EMAIL_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '403':
          description: User is not authorized to update this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Você não tem autorização para alterar este usuário.
                code: USER_UPDATE_FORBIDDEN
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nenhum usuário foi encontrado com o ID informado.
                code: USER_NOT_FOUND
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Já existe um usuário cadastrado com este e-mail.
                code: EMAIL_ALREADY_REGISTERED
        '500':
          description: Account update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível atualizar a conta neste momento.
                code: USER_UPDATE_FAILED
    delete:
      tags: [Users]
      summary: Delete account
      description: Deletes the authenticated user's account. The path ID must match the authenticated user's ID.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                user_id_required:
                  value:
                    error: O ID do usuário é obrigatório.
                    code: USER_ID_REQUIRED
                user_id_invalid:
                  value:
                    error: O ID do usuário informado é inválido.
                    code: USER_ID_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '403':
          description: User is not authorized to delete this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Você não tem autorização para remover este usuário.
                code: USER_DELETE_FORBIDDEN
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nenhum usuário foi encontrado com o ID informado.
                code: USER_NOT_FOUND
        '409':
          description: User has related records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível remover o usuário porque ele possui registros relacionados.
                code: USER_DELETE_CONFLICT
        '500':
          description: Account deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    post:
      tags: [Products]
      summary: Create product
      description: Creates a product for the authenticated user. The user ID is obtained from the JWT.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              nameProduct: Notebook
              category: Eletrônicos
              costPrice: 2500
              priceToSell: 3299.9
              quantity: 10
              warningPoint: 3
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMutationResponse'
        '400':
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name_required:
                  value:
                    error: O nome do produto é obrigatório.
                    code: PRODUCT_NAME_REQUIRED
                category_required:
                  value:
                    error: A categoria do produto é obrigatória.
                    code: PRODUCT_CATEGORY_REQUIRED
                cost_price_invalid:
                  value:
                    error: O custo do produto deve ser um número não-negativo.
                    code: PRODUCT_COSTPRICE_INVALID
                price_to_sell_invalid:
                  value:
                    error: O preço de venda deve ser um número não-negativo.
                    code: PRODUCT_PRICETOSELL_INVALID
                quantity_invalid:
                  value:
                    error: A quantidade deve ser um inteiro não-negativo.
                    code: PRODUCT_QUANTITY_INVALID
                warning_point_invalid:
                  value:
                    error: O ponto de aviso (warningPoint) deve ser um inteiro não-negativo.
                    code: PRODUCT_WARNINGPOINT_INVALID
                user_id_invalid:
                  value:
                    error: O ID do usuário associado ao produto é obrigatório e inválido.
                    code: PRODUCT_USERID_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '404':
          description: Authenticated user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O ID do usuário não existe.
                code: PRODUCT_USERID_NOT_FOUND
        '500':
          description: Product creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                creation_failed:
                  value:
                    error: Erro ao criar o produto.
                    code: PRODUCT_CREATION_FAILED
                creation_failed_alt:
                  value:
                    error: Não foi possível cadastrar o produto agora.
                    code: PRODUCT_CREATE_FAILED

    get:
      tags: [Products]
      summary: List products
      description: Returns all products belonging to the authenticated user.
      operationId: listProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Invalid authenticated user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                user_id_required:
                  value:
                    error: O ID do usuário é obrigatório.
                    code: USER_ID_REQUIRED
                user_id_invalid:
                  value:
                    error: O ID do usuário informado é inválido.
                    code: USER_ID_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '404':
          description: Authenticated user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O ID do usuário não existe.
                code: PRODUCT_USERID_NOT_FOUND
        '500':
          description: Product retrieval failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Erro ao buscar os produtos deste usuário.
                code: PRODUCT_FETCH_FAILED

  /products/{id}:
    put:
      tags: [Products]
      summary: Update product
      description: Updates a product only if it belongs to the authenticated user.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMutationResponse'
        '400':
          description: Invalid product ID or product data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                product_id_required:
                  value:
                    error: O ID do produto é obrigatório.
                    code: PRODUCT_ID_REQUIRED
                product_id_invalid:
                  value:
                    error: O ID do produto informado é inválido.
                    code: PRODUCT_ID_INVALID
                name_required:
                  value:
                    error: O nome do produto é obrigatório.
                    code: PRODUCT_NAME_REQUIRED
                category_required:
                  value:
                    error: A categoria do produto é obrigatória.
                    code: PRODUCT_CATEGORY_REQUIRED
                cost_price_invalid:
                  value:
                    error: O custo do produto deve ser um número não-negativo.
                    code: PRODUCT_COSTPRICE_INVALID
                price_to_sell_invalid:
                  value:
                    error: O preço de venda deve ser um número não-negativo.
                    code: PRODUCT_PRICETOSELL_INVALID
                quantity_invalid:
                  value:
                    error: A quantidade deve ser um inteiro não-negativo.
                    code: PRODUCT_QUANTITY_INVALID
                warning_point_invalid:
                  value:
                    error: O ponto de aviso (warningPoint) deve ser um inteiro não-negativo.
                    code: PRODUCT_WARNINGPOINT_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '403':
          description: Product belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Você não tem autorização para atualizar este produto.
                code: PRODUCT_UPDATE_FORBIDDEN
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O ID do produto não existe.
                code: PRODUCT_ID_NOT_FOUND
        '500':
          description: Product update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Erro ao atualizar o produto.
                code: PRODUCT_UPDATE_FAILED

    delete:
      tags: [Products]
      summary: Delete product
      description: Deletes a product only if it belongs to the authenticated user.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProductResponse'
        '400':
          description: Invalid product or user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                product_id_required:
                  value:
                    error: O ID do produto é obrigatório.
                    code: PRODUCT_ID_REQUIRED
                product_id_invalid:
                  value:
                    error: O ID do produto informado é inválido.
                    code: PRODUCT_ID_INVALID
                user_id_required:
                  value:
                    error: O ID do usuário é obrigatório.
                    code: USER_ID_REQUIRED
                user_id_invalid:
                  value:
                    error: O ID do usuário informado é inválido.
                    code: USER_ID_INVALID
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido ou expirado.
                code: AUTH_TOKEN_INVALID
        '403':
          description: Product does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Você não tem autorização para deletar este produto ou ele não existe.
                code: PRODUCT_DELETE_FORBIDDEN
        '500':
          description: Product deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não foi possível deletar o produto neste momento.
                code: PRODUCT_DELETE_FAILED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /login. Token expires after 1 hour.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the user.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 64f000000000000000000001

    ProductId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the product.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 64f000000000000000000002

  schemas:
    CreateUserRequest:
      type: object
      required: [nameStore, email, key, accountPro]
      properties:
        nameStore:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        key:
          type: string
          minLength: 6
          description: Password. Stored as a bcrypt hash.
        accountPro:
          type: boolean

    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nameStore:
          type: string
          minLength: 1
        email:
          type: string
          format: email

    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    User:
      type: object
      properties:
        id:
          type: string
        nameStore:
          type: string
        email:
          type: string
          format: email
        accountPro:
          type: boolean

    CreateUserResponse:
      type: object
      properties:
        response:
          type: string
          example: Conta criada com sucesso
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required: [email, key]
      properties:
        email:
          type: string
          format: email
        key:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT authentication token. Expires after 1 hour.

    ProductRequest:
      type: object
      required:
        - nameProduct
        - category
        - costPrice
        - priceToSell
        - quantity
        - warningPoint
      properties:
        nameProduct:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        costPrice:
          type: number
          format: float
          minimum: 0
        priceToSell:
          type: number
          format: float
          minimum: 0
        quantity:
          type: integer
          minimum: 0
        warningPoint:
          type: integer
          minimum: 0

    Product:
      type: object
      properties:
        id:
          type: string
        nameProduct:
          type: string
        category:
          type: string
        costPrice:
          type: number
          format: float
        priceToSell:
          type: number
          format: float
        quantity:
          type: integer
        warningPoint:
          type: integer
        userId:
          type: string

